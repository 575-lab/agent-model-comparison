[project]
name = "agent-model-comparison"
version = "0.1.0"
description = "Compare open-source models on tool-use accuracy, multi-step completion, and cost/latency."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
vllm = ["vllm>=0.6.0"]

[project.scripts]
agent-eval = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.0",
]
